spring.application.name=4-ApiConKeycloak

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Estas configs hacen que corra el data.sql que carga los roles y permisos en la bbdd.
# La 2da hace que ponga los valores despues de que Hibernate cree las tablas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Configs de JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.expiration-ms=${JWT_EXPIRE}