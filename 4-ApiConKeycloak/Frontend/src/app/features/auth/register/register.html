<app-auth-shell
  eyebrow="Registro"
  title="Crear cuenta"
  subtitle="Completá los datos y en un paso ya podés entrar."
>
  @if (errorDelServidor(); as error) {
    <app-alert tone="danger" class="register__aviso">{{ error }}</app-alert>
  }

  <app-user-form
    idPrefijo="register"
    textoEnviar="Crear cuenta"
    textoEnviando="Creando cuenta…"
    [enviando]="enviando()"
    (enviar)="crearCuenta($event)"
  />

  <p data-footer>
    ¿Ya tenés cuenta?
    <a routerLink="/login">Iniciá sesión</a>
  </p>
</app-auth-shell>
