# Tema de login "fuchibol": hereda de keycloak.v2 (PatternFly 5) y agrega estilos propios.
parent=keycloak.v2
import=common/keycloak

# Orden de carga: primero la hoja del padre (css/styles.css se resuelve en keycloak.v2),
# despues los tokens copiados del front y por ultimo los estilos propios.
# No nombrar ningun archivo propio "styles.css": taparia el del padre.
styles=css/styles.css css/tokens.css css/fuchibol.css

# El padre ya define darkMode=true y todas las clases kc*: no se redefinen.
