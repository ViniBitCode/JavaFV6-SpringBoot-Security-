<a class="skip-link" href="#contenido">Ir al contenido</a>

<div class="panel">
  <header class="panel__bar">
    <app-brand />

    <div class="panel__actions">
      @if (perfil.perfil(); as datos) {
        <span class="panel__chip">
          <span class="panel__avatar" aria-hidden="true">{{ datos.username.charAt(0) }}</span>
          <span class="panel__chip-text">{{ datos.username }}</span>
        </span>
      }

      <app-theme-toggle />

      <button
        type="button"
        class="btn btn--ghost panel__logout"
        [disabled]="saliendo()"
        (click)="cerrarSesion()"
      >
        {{ saliendo() ? 'Saliendo…' : 'Cerrar sesión' }}
      </button>
    </div>
  </header>

  <main class="panel__main" id="contenido">
    <!-- Avisos globales: los deja el interceptor (403, API caída). -->
    @if (aviso(); as notice) {
      <div class="panel__aviso">
        <app-alert [tone]="notice.tone">{{ notice.text }}</app-alert>
        <button type="button" class="panel__aviso-cerrar" (click)="descartarAviso()">
          Descartar
        </button>
      </div>
    }

    <router-outlet />
  </main>
</div>
