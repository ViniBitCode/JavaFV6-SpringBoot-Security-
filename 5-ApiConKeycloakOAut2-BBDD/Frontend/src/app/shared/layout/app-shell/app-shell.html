<div class="shell">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="topbar__brand" routerLink="/panel" aria-label="Ir al inicio">
        <app-brand />
      </a>

      <div class="user-menu" #userMenu>
        <button
          type="button"
          class="user-menu__trigger"
          (click)="toggleMenu()"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="user-menu-list"
        >
          <app-avatar [name]="displayName()" />
          <span class="user-menu__name">{{ displayName() }}</span>
          <svg class="user-menu__chevron" aria-hidden="true" viewBox="0 0 20 20" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 8 4 4 4-4" />
          </svg>
        </button>

        @if (menuOpen()) {
          <div class="user-menu__panel card card--elevated" id="user-menu-list" role="menu">
            <div class="user-menu__header">
              <span class="user-menu__title">{{ displayName() }}</span>
              <span class="user-menu__email text-xs text-subtle">{{ email() }}</span>
            </div>
            <button type="button" class="user-menu__item user-menu__item--logout" role="menuitem" (click)="logout()">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 17l5-5-5-5" />
                <path d="M15 12H3" />
                <path d="M21 3v18" />
              </svg>
              Cerrar sesión
            </button>
          </div>
        }
      </div>
    </div>
  </header>

  <!-- Navegación principal: barra lateral en escritorio -->
  <nav class="sidenav" aria-label="Principal">
    <ul class="nav-list">
      @for (item of navItems; track item.path) {
        <li>
          <a class="nav-link" [routerLink]="item.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: !!item.exact }" ariaCurrentWhenActive="page">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              @switch (item.icon) {
                @case ('torneos') {
                  <path d="M7 4h10v4a5 5 0 0 1-10 0z" /><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4" />
                  <path d="M12 13v3M9 20h6M10 16h4v4h-4z" />
                }
                @default {
                  <path d="M3 11.5 12 4l9 7.5" />
                  <path d="M5 10v10h5v-6h4v6h5V10" />
                }
              }
            </svg>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <main class="shell__main">
    <router-outlet />
  </main>

  <!-- Navegación principal: menú inferior en mobile -->
  <nav class="bottomnav" aria-label="Principal">
    <ul class="nav-list nav-list--row">
      @for (item of navItems; track item.path) {
        <li>
          <a class="nav-link nav-link--stacked" [routerLink]="item.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: !!item.exact }" ariaCurrentWhenActive="page">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              @switch (item.icon) {
                @case ('torneos') {
                  <path d="M7 4h10v4a5 5 0 0 1-10 0z" /><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4" />
                  <path d="M12 13v3M9 20h6M10 16h4v4h-4z" />
                }
                @default {
                  <path d="M3 11.5 12 4l9 7.5" />
                  <path d="M5 10v10h5v-6h4v6h5V10" />
                }
              }
            </svg>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
