<header class="auth-heading">
  <h1>Crear cuenta</h1>
  <p class="text-muted text-sm">Completa tus datos para empezar.</p>
</header>

<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="field">
    <label class="field__label" for="register-username">Usuario</label>
    <input
      id="register-username"
      class="input"
      type="text"
      formControlName="username"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      [attr.aria-invalid]="showError('username') || null"
      [attr.aria-describedby]="showError('username') ? 'register-username-error' : null"
    />
    <app-field-error id="register-username-error" [message]="errorMessage('username')" />
  </div>

  <div class="field">
    <label class="field__label" for="register-email">Email</label>
    <input
      id="register-email"
      class="input"
      type="email"
      formControlName="email"
      autocomplete="email"
      inputmode="email"
      spellcheck="false"
      [attr.aria-invalid]="showError('email') || null"
      [attr.aria-describedby]="showError('email') ? 'register-email-error' : null"
    />
    <app-field-error id="register-email-error" [message]="errorMessage('email')" />
  </div>

  <div class="field">
    <label class="field__label" for="register-password">Contraseña</label>
    <app-password-field
      id="register-password"
      [control]="form.controls.password"
      autocomplete="new-password"
      [invalid]="showError('password')"
      [describedBy]="showError('password') ? 'register-password-error register-password-rules' : 'register-password-rules'"
    />
    <app-field-error id="register-password-error" [message]="errorMessage('password')" />

    <ul class="checklist" id="register-password-rules" aria-label="Requisitos de la contraseña">
      @for (rule of passwordRules; track rule.key) {
        <li class="checklist__item" [class.is-met]="ruleStatus()[rule.key]">
          <span class="checklist__icon" aria-hidden="true">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.5 6.5 5 9l4.5-6" />
            </svg>
          </span>
          <span>{{ rule.label }}</span>
          <span class="visually-hidden">{{ ruleStatus()[rule.key] ? '(cumplido)' : '(pendiente)' }}</span>
        </li>
      }
    </ul>
  </div>

  <div class="field">
    <label class="field__label" for="register-confirm">Confirmar contraseña</label>
    <app-password-field
      id="register-confirm"
      [control]="form.controls.confirmPassword"
      autocomplete="new-password"
      [invalid]="showError('confirmPassword')"
      [describedBy]="showError('confirmPassword') ? 'register-confirm-error' : null"
    />
    <app-field-error id="register-confirm-error" [message]="errorMessage('confirmPassword')" />
  </div>

  <button
    type="submit"
    class="btn btn--primary btn--block"
    [class.is-loading]="loading()"
    [disabled]="loading()"
    [attr.aria-busy]="loading()"
  >
    Crear cuenta
  </button>
</form>

<div class="divider" role="separator">o continuar con</div>

<app-social-buttons />

<p class="auth-switch text-sm text-muted">
  ¿Ya tienes cuenta? <a class="link" routerLink="/login">Iniciar sesión</a>
</p>
